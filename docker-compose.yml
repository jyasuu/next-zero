services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://keycloak.local:8080
      KC_HOSTNAME_ADMIN_URL: http://keycloak.local:8080
      KC_HTTP_RELATIVE_PATH: /
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /realms/next-zero HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - keycloak.local

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AUTH_SECRET: dev-secret-not-for-production
      NEXTAUTH_URL: http://app.local:3000
      AUTH_PROVIDER: keycloak
      KEYCLOAK_CLIENT_ID: next-zero-app
      KEYCLOAK_CLIENT_SECRET: ""
      KEYCLOAK_ISSUER: http://keycloak.local:8080/realms/next-zero
      ROLE_MAPPING: '{"admin":"Admin","editor":"Editor","viewer":"Viewer"}'
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        aliases:
          - app.local

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.0
    working_dir: /app
    command: >
      sh -c "
        npm install -g pnpm@8.15.6 &&
        pnpm install --frozen-lockfile &&
        pnpm exec playwright test
      "
    volumes:
      - .:/app
    environment:
      PORT: 3000
      AUTH_SECRET: dev-secret-not-for-production
      NEXTAUTH_URL: http://app.local:3000
      AUTH_PROVIDER: keycloak
      KEYCLOAK_CLIENT_ID: next-zero-app
      KEYCLOAK_CLIENT_SECRET: ""
      KEYCLOAK_ISSUER: http://keycloak.local:8080/realms/next-zero
      PLAYWRIGHT_BASE_URL: http://app.local:3000
    depends_on:
      app:
        condition: service_started
